# Contributor note:
# - Each top-level key is an outfit slug referenced from cards.yaml.
# - Keep outfit prompts focused on clothing and accessories.
# - Use `default_display` for a short label when the outfit should appear on the card UI.
# - Optional `lora` accepts one or more names or `{name, weight}` mappings.

